<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menú del Día</title>
  <style>
    :root{
      --yellow:#f6d86a;
      --black:#0b0b0b;
      --white:#ffffff;
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      height:100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#111;
    }

    .page{
      height:100vh;
      display:grid;
      grid-template-rows: auto 1fr;
      overflow:hidden;
    }

    .hero{
      background: var(--yellow);
      color:#111;
      padding: 14px 24px 10px;
      border-bottom: 6px solid rgba(0,0,0,.08);
    }

    .heroTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .logoBox{
      width:130px;
      height:80px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .logoImg{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      display:block;
    }

    .logoLeft .logoImg{
      transform:scale(1.02);
    }

    .logoRight .logoImg{
      transform:scale(.95);
    }

    .titleWrap{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .title{
      background:#000;
      color:#fff;
      padding:10px 24px;
      border-radius:10px;
      font-weight:900;
      font-size: clamp(28px, 3.2vw, 60px);
      text-transform:uppercase;
      line-height:1;
      text-align:center;
    }

    .plans{
      margin-top:8px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      align-items:start;
    }

    .plan{
      padding:4px 8px;
      text-align:center;
      min-height:160px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
    }

    .price{
      font-weight:900;
      font-size: clamp(24px, 2.4vw, 46px);
      margin-bottom:8px;
      line-height:1;
    }

    .badge{
      display:inline-block;
      background:#000;
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      font-weight:900;
      font-size: clamp(16px, 1.4vw, 28px);
      text-transform:uppercase;
      line-height:1.05;
    }

    .plus{
      margin-top:14px;
      font-weight:900;
      font-size: clamp(18px, 1.5vw, 28px);
      line-height:1.02;
      text-transform:uppercase;
    }

    .foot{
      margin-top:6px;
      text-align:center;
      font-size: clamp(11px, .95vw, 16px);
      opacity:.92;
      line-height:1.2;
    }

    .showcaseWrap{
      min-height:0;
      background:#111;
      padding: 16px 24px 20px;
      overflow:hidden;
    }

    .showcase{
      width:100%;
      height:100%;
      background:#050505;
      border-radius:24px;
      overflow:hidden;
      display:grid;
      grid-template-columns: 50% 50%;
      box-shadow:
        0 18px 50px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.05);
    }

    .mediaPanel{
      position:relative;
      min-width:0;
      min-height:0;
      overflow:hidden;
      border-right:1px solid rgba(255,255,255,.06);
      background:#000;
    }

    .mediaImg{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }

    .infoPanel{
      min-width:0;
      min-height:0;
      background: radial-gradient(circle at top left, #161616, #070707 70%);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 32px;
      text-align:center;
      overflow:hidden;
    }

    .infoBox{
      width:100%;
      max-width:640px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
    }

    .tag{
      display:inline-block;
      padding:8px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      font-weight:800;
      font-size: clamp(13px, .95vw, 17px);
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .productTitle{
      margin:0;
      font-size: clamp(30px, 4vw, 72px);
      font-weight:900;
      line-height:1.02;
      text-transform:uppercase;
      word-break:break-word;
    }

    .productText{
      margin:0;
      font-size: clamp(18px, 1.8vw, 34px);
      opacity:.92;
      line-height:1.18;
      max-width:90%;
    }

    .productPrice{
      display:inline-block;
      background:#fff;
      color:#000;
      padding:14px 26px;
      border-radius:18px;
      font-weight:900;
      font-size: clamp(30px, 3.4vw, 68px);
      line-height:1;
      margin-top:4px;
    }

    @media (max-width: 1100px){
      .hero{
        padding:12px 18px 8px;
      }

      .logoBox{
        width:110px;
        height:70px;
      }

      .title{
        font-size: clamp(24px, 3vw, 48px);
      }

      .plan{
        min-height:145px;
      }

      .showcaseWrap{
        padding:14px 18px 18px;
      }

      .infoPanel{
        padding:22px 20px;
      }
    }

    @media (max-width: 900px){
      .page{
        height:auto;
        min-height:100vh;
        grid-template-rows:auto auto;
      }

      .heroTop{
        flex-direction:column;
        gap:10px;
      }

      .plans{
        grid-template-columns:1fr;
      }

      .plan{
        min-height:auto;
        padding:10px 8px;
      }

      .showcaseWrap{
        padding:16px;
      }

      .showcase{
        min-height:520px;
        grid-template-columns:1fr;
        grid-template-rows: 48% 52%;
      }

      .mediaPanel{
        border-right:none;
        border-bottom:1px solid rgba(255,255,255,.06);
      }

      .infoPanel{
        padding:24px 18px;
      }

      .productTitle{
        font-size: clamp(28px, 8vw, 46px);
      }

      .productText{
        max-width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="hero">
      <div class="heroTop">
        <div class="logoBox logoLeft">
          <img src="/img/logo-izq.png" alt="Logo izquierdo" class="logoImg">
        </div>

        <div class="titleWrap">
          <div class="title">MENÚ DEL DÍA</div>
        </div>

        <div class="logoBox logoRight">
          <img src="/img/logo-der.png" alt="Logo derecho" class="logoImg">
        </div>
      </div>

      <div class="plans">
        <div class="plan">
          <div class="price">$4.100</div>
          <div class="badge">Plato de Fondo</div>
        </div>

        <div class="plan">
          <div class="price">$4.600</div>
          <div class="badge">Plato de Fondo</div>
          <div class="plus">+<br>Postre o<br>Ensalada</div>
        </div>

        <div class="plan">
          <div class="price">$5.100</div>
          <div class="badge">Plato de Fondo</div>
          <div class="plus">+<br>Postre y<br>Ensalada</div>
        </div>
      </div>

      <div class="foot">
        Todos los menús incluyen pan, sopa y jugo o agua • Menús válidos hasta agotar stock.
      </div>
    </header>

    <main class="showcaseWrap">
      <section class="showcase">
        <div class="mediaPanel">
          <img id="slideImage" class="mediaImg" alt="Producto destacado">
        </div>

        <div class="infoPanel">
          <div class="infoBox">
            <div id="slideTag" class="tag">Menú del día</div>
            <h2 id="slideTitle" class="productTitle">Plato de fondo</h2>
            <p id="slideText" class="productText">Incluye pan, sopa y jugo o agua.</p>
            <div id="slidePrice" class="productPrice">$4.100</div>
          </div>
        </div>
      </section>
    </main>

  </div>

  <script>
    let lastV = null;

    const items = [
      {
        tag: "Menú del día",
        title: "Plato de Fondo",
        text: "Incluye pan, sopa y jugo o agua.",
        price: "$4.100",
        dynamic: true
      },
      {
        tag: "Sandwiches",
        title: "Sandwich Huevo (Antumapu)",
        text: "Hasta agotar stock",
        price: "$1.250",
        image: "/img/pan-huevo.png"
      },
      {
        tag: "Completos",
        title: "Completo Italiano",
        text: "Vienesa + Tomate + Palta",
        price: "$2.550",
        image: "/img/completo.jpg"
      },
      {
        tag: "Bebidas",
        title: "Jugos y Refrescos",
        text: "Distintas alternativas para acompañar tu almuerzo.",
        price: "$1.200",
        image: "/img/bebidas.jpg"
      }
    ];

    let current = 0;

    async function getDynamicMenuImage() {
      try {
        const r = await fetch('/api/version', { cache: 'no-store' });
        const data = await r.json();

        if (data.url) {
          if (data.v !== lastV) {
            lastV = data.v;
          }
          return data.url + '?v=' + data.v;
        }
      } catch (e) {
        console.error('Error cargando imagen dinámica:', e);
      }
      return "";
    }

    async function renderSlide(index) {
      const item = items[index];

      document.getElementById('slideTag').textContent = item.tag;
      document.getElementById('slideTitle').textContent = item.title;
      document.getElementById('slideText').textContent = item.text;
      document.getElementById('slidePrice').textContent = item.price;

      if (item.dynamic) {
        const dynamicUrl = await getDynamicMenuImage();
        if (dynamicUrl) {
          document.getElementById('slideImage').src = dynamicUrl;
        }
      } else {
        document.getElementById('slideImage').src = item.image;
      }
    }

    async function nextSlide() {
      current = (current + 1) % items.length;
      await renderSlide(current);
    }

    renderSlide(current);
    setInterval(nextSlide, 10000);

    setInterval(async () => {
      if (items[current].dynamic) {
        await renderSlide(current);
      }
    }, 15000);
  </script>
</body>
</html>
