<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menú Digital</title>
  <style>
    :root{
      --yellow:#f6d86a;
      --black:#0b0b0b;
      --white:#fff;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      height:100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#111;
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:var(--yellow);
    }

    .hero{
      padding:18px 28px 12px;
      border-bottom:6px solid rgba(0,0,0,.08);
    }

    .heroTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .logoBox{
      width:160px;
      height:100px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .logoImg{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      display:block;
    }

    .titleWrap{
      flex:1;
      display:flex;
      justify-content:center;
    }

    .title{
      background:#000;
      color:#fff;
      padding:12px 28px;
      border-radius:10px;
      font-weight:900;
      font-size: clamp(30px, 4vw, 68px);
      text-transform:uppercase;
      line-height:1;
    }

    .plans{
      margin-top:10px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      text-align:center;
    }

    .plan{
      padding:8px;
    }

    .price{
      font-weight:900;
      font-size: clamp(28px, 2.7vw, 54px);
      margin-bottom:10px;
    }

    .badge{
      display:inline-block;
      background:#000;
      color:#fff;
      padding:10px 18px;
      border-radius:10px;
      font-weight:900;
      font-size: clamp(18px, 1.7vw, 30px);
      text-transform:uppercase;
    }

    .plus{
      margin-top:14px;
      font-weight:900;
      font-size: clamp(20px, 1.8vw, 30px);
      line-height:1.05;
      text-transform:uppercase;
    }

    .foot{
      margin-top:10px;
      text-align:center;
      font-size: clamp(11px, 1vw, 18px);
      opacity:.9;
    }

    .showcaseWrap{
      flex:1;
      padding:22px 34px 30px;
      background:#111;
    }

    .showcase{
      width:100%;
      height:100%;
      min-height:360px;
      background:#000;
      border-radius:24px;
      overflow:hidden;
      display:grid;
      grid-template-columns: 50% 50%;
      box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.05);
    }

    .mediaPanel{
      position:relative;
      background:#000;
      border-right:1px solid rgba(255,255,255,.08);
    }

    .mediaImg{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .infoPanel{
      background: radial-gradient(circle at top left, #181818, #070707 70%);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px;
      text-align:center;
    }

    .infoBox{
      width:100%;
      max-width:700px;
    }

    .tag{
      display:inline-block;
      padding:8px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      font-weight:800;
      font-size: clamp(14px, 1vw, 18px);
      text-transform:uppercase;
      letter-spacing:.5px;
      margin-bottom:18px;
    }

    .productTitle{
      font-size: clamp(34px, 4vw, 78px);
      font-weight:900;
      line-height:1.02;
      text-transform:uppercase;
      margin:0 0 18px;
    }

    .productText{
      font-size: clamp(20px, 2vw, 38px);
      opacity:.92;
      margin:0 0 28px;
      line-height:1.2;
    }

    .productPrice{
      display:inline-block;
      background:#fff;
      color:#000;
      padding:16px 30px;
      border-radius:18px;
      font-weight:900;
      font-size: clamp(34px, 4vw, 78px);
      line-height:1;
    }

    @media (max-width: 900px){
      .heroTop{
        flex-direction:column;
      }

      .plans{
        grid-template-columns:1fr;
      }

      .showcase{
        grid-template-columns:1fr;
        grid-template-rows:45% 55%;
        min-height:600px;
      }

      .mediaPanel{
        border-right:none;
        border-bottom:1px solid rgba(255,255,255,.08);
      }

      .infoPanel{
        padding:28px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="hero">
      <div class="heroTop">
        <div class="logoBox">
          <img src="/img/logo-izq.png" alt="Logo izquierdo" class="logoImg">
        </div>

        <div class="titleWrap">
          <div class="title">MENÚ DEL DÍA</div>
        </div>

        <div class="logoBox">
          <img src="/img/logo-der.png" alt="Logo derecho" class="logoImg">
        </div>
      </div>

      <div class="plans">
        <div class="plan">
          <div class="price">$4.100</div>
          <div class="badge">Plato de Fondo</div>
        </div>

        <div class="plan">
          <div class="price">$4.600</div>
          <div class="badge">Plato de Fondo</div>
          <div class="plus">+<br>Postre o<br>Ensalada</div>
        </div>

        <div class="plan">
          <div class="price">$5.100</div>
          <div class="badge">Plato de Fondo</div>
          <div class="plus">+<br>Postre y<br>Ensalada</div>
        </div>
      </div>

      <div class="foot">
        Todos los menús incluyen pan, sopa y jugo o agua • Menús válidos hasta agotar stock.
      </div>
    </header>

    <main class="showcaseWrap">
      <section class="showcase">

        <div class="mediaPanel">
          <img id="slideImage" class="mediaImg" alt="Producto destacado">
        </div>

        <div class="infoPanel">
          <div class="infoBox">
            <div id="slideTag" class="tag">Destacado</div>
            <h2 id="slideTitle" class="productTitle">Menú del día</h2>
            <p id="slideText" class="productText">Descripción del producto</p>
            <div id="slidePrice" class="productPrice">$0</div>
          </div>
        </div>

      </section>
    </main>
  </div>

  <script>
    let lastV = null;

    const items = [
      {
        tag: "Menú del día",
        title: "Plato de Fondo",
        text: "Incluye pan, sopa y jugo o agua.",
        price: "$4.100",
        dynamic: true
      },
      {
        tag: "Promoción",
        title: "Empanada + Bebida",
        text: "Promoción especial del día.",
        price: "$2.990",
        image: "/img/promo-empanada.jpg"
      },
      {
        tag: "Postre",
        title: "Postre Casero",
        text: "Pregunta por la opción disponible hoy.",
        price: "$1.500",
        image: "/img/postre.jpg"
      },
      {
        tag: "Bebidas",
        title: "Jugos y Refrescos",
        text: "Distintas alternativas para acompañar tu almuerzo.",
        price: "$1.200",
        image: "/img/bebidas.jpg"
      }
    ];

    let current = 0;

    async function getDynamicMenuImage() {
      try {
        const r = await fetch('/api/version', { cache: 'no-store' });
        const data = await r.json();

        if (data.v !== lastV && data.url) {
          lastV = data.v;
          return data.url + '?v=' + data.v;
        }

        if (data.url) {
          return data.url + '?v=' + data.v;
        }
      } catch (e) {
        console.error('Error cargando imagen dinámica:', e);
      }
      return "";
    }

    async function renderSlide(index) {
      const item = items[index];

      document.getElementById('slideTag').textContent = item.tag;
      document.getElementById('slideTitle').textContent = item.title;
      document.getElementById('slideText').textContent = item.text;
      document.getElementById('slidePrice').textContent = item.price;

      if (item.dynamic) {
        const dynamicUrl = await getDynamicMenuImage();
        if (dynamicUrl) {
          document.getElementById('slideImage').src = dynamicUrl;
        }
      } else {
        document.getElementById('slideImage').src = item.image;
      }
    }

    async function nextSlide() {
      current = (current + 1) % items.length;
      await renderSlide(current);
    }

    renderSlide(current);
    setInterval(nextSlide, 10000);

    setInterval(async () => {
      if (items[current].dynamic) {
        await renderSlide(current);
      }
    }, 15000);
  </script>
</body>
</html>
